services:
  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ai-invoice-backend

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_PATH: /app/data/database.sqlite

    expose:
      - "5000"

    volumes:
      - ai-invoice-data:/app/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

  # Frontend web service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1

    container_name: ai-invoice-frontend

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  ai-invoice-data:
    name: ai-invoice-data